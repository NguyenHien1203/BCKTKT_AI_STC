server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) — mọi path không khớp file tĩnh
    # đều trả về index.html để React tự xử lý route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy sang từng microservice, khớp với vite.config.js (dùng cho `npm run dev`)
    # để URL gọi API giống nhau ở cả 2 môi trường dev và docker.
    location /api/auth-identity/ {
        proxy_pass http://auth-identity-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ingestion/ {
        proxy_pass http://ingestion-service:8000/;
        proxy_set_header Host $host;
    }

    location /api/data-quality/ {
        proxy_pass http://data-quality-service:8000/;
        proxy_set_header Host $host;
    }

    location /api/reporting/ {
        proxy_pass http://reporting-service:8000/;
        proxy_set_header Host $host;
    }

    location /api/gateway/ {
        proxy_pass http://api-gateway-service:8000/;
        proxy_set_header Host $host;
    }

    location /api/ai/ {
        proxy_pass http://ai-service:8000/;
        proxy_set_header Host $host;
    }

    location /api/ops/ {
        proxy_pass http://ops-service:8000/;
        proxy_set_header Host $host;
    }

    location /api/gov-report/ {
        proxy_pass http://gov-report-service:8000/;
        proxy_set_header Host $host;
    }
}
