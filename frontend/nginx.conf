server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker (luôn ở 127.0.0.11 trong network do Compose
    # quản lý) — dùng để resolve tên service (vd `reporting-service`) TẠI
    # THỜI ĐIỂM REQUEST thay vì lúc nginx khởi động/parse config. Cần thiết
    # vì `proxy_pass` với host tĩnh (không phải biến) khiến nginx resolve
    # NGAY lúc load config và crash "host not found in upstream" nếu
    # service đích chưa kịp có network alias — dễ xảy ra do `frontend`
    # không (và không cần) chờ TẤT CẢ backend qua `depends_on`. Dùng biến
    # (`set $upstream_xxx ...; proxy_pass http://$upstream_xxx;`) trì hoãn
    # việc resolve sang lúc có request đầu tiên, có `valid=10s` để tự thử
    # lại nếu container backend restart và đổi IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # React Router (client-side routing) — mọi path không khớp file tĩnh
    # đều trả về index.html để React tự xử lý route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy sang từng microservice, khớp với vite.config.js (dùng cho `npm run dev`)
    # để URL gọi API giống nhau ở cả 2 môi trường dev và docker.
    location /api/auth-identity/ {
        set $upstream_auth_identity auth-identity-service:8000;
        rewrite ^/api/auth-identity/(.*)$ /$1 break;
        proxy_pass http://$upstream_auth_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ingestion/ {
        set $upstream_ingestion ingestion-service:8000;
        rewrite ^/api/ingestion/(.*)$ /$1 break;
        proxy_pass http://$upstream_ingestion;
        proxy_set_header Host $host;
    }

    location /api/data-quality/ {
        set $upstream_data_quality data-quality-service:8000;
        rewrite ^/api/data-quality/(.*)$ /$1 break;
        proxy_pass http://$upstream_data_quality;
        proxy_set_header Host $host;
    }

    location /api/reporting/ {
        set $upstream_reporting reporting-service:8000;
        rewrite ^/api/reporting/(.*)$ /$1 break;
        proxy_pass http://$upstream_reporting;
        proxy_set_header Host $host;
    }

    location /api/api-gateway/ {
        set $upstream_gateway api-gateway-service:8000;
        rewrite ^/api/api-gateway/(.*)$ /$1 break;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
    }

    location /api/ai/ {
        set $upstream_ai ai-service:8000;
        rewrite ^/api/ai/(.*)$ /$1 break;
        proxy_pass http://$upstream_ai;
        proxy_set_header Host $host;
    }

    location /api/ops/ {
        set $upstream_ops ops-service:8000;
        rewrite ^/api/ops/(.*)$ /$1 break;
        proxy_pass http://$upstream_ops;
        proxy_set_header Host $host;
    }

    location /api/gov-report/ {
        set $upstream_gov_report gov-report-service:8000;
        rewrite ^/api/gov-report/(.*)$ /$1 break;
        proxy_pass http://$upstream_gov_report;
        proxy_set_header Host $host;
    }
}