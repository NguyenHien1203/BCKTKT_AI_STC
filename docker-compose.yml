version: "3.9"

# Hạ tầng dùng chung + toàn bộ 8 microservice (khung Clean Architecture).
# UC nghiệp vụ được implement dần theo PLAN.md; service nào chưa có UC vẫn
# chạy được (chỉ có /health) để bạn có thể build/deploy khung trước.

x-app-env: &app-env
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
  POSTGRES_DB: ${POSTGRES_DB:-financial_dw}

services:
  # ---------- Hạ tầng dùng chung ----------
  postgres:
    image: postgres:16
    container_name: hy-postgres
    restart: unless-stopped
    environment: *app-env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-financial_dw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hy-rabbitmq
    restart: unless-stopped
    environment:
      # RabbitMQ chặn user "guest" mặc định kết nối từ ngoài loopback — các
      # service khác kết nối qua tên host "rabbitmq" trong mạng Docker (không
      # phải loopback) nên BẮT BUỘC phải đặt user/mật khẩu riêng ở đây.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app_password}
    ports:
      - "5672:5672"
      - "15672:15672"

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: hy-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=123@123aA
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:latest
    container_name: hy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: hy-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Cố định hostname để "iss" (issuer) trong token luôn nhất quán, bất kể
      # request gọi tới Keycloak từ mạng nội bộ Docker (http://keycloak:8080,
      # dùng bởi backend) hay từ trình duyệt (http://localhost:8080). Nếu
      # không set, Keycloak tự suy ra issuer theo Host header của từng request
      # -> 2 bên tính ra issuer khác nhau -> lỗi "Token verification failed".
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: hy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: hy-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"

  # UC-047 (nâng cấp Embedded Dashboard SDK + Guest Token) — xem ADR-005
  # trong ARCHITECTURE.md. Sau khi container chạy lần đầu, cần 1 lượt cấu
  # hình thủ công qua UI/CLI Superset (chưa tự động hoá trong compose này):
  #   1. Tạo tài khoản dịch vụ riêng (vd. `guest_token_svc`) + gán role có
  #      quyền tối thiểu để gọi `/api/v1/security/guest_token/` (Superset
  #      gọi là role "Public"/role tự tạo cho embedding, KHÔNG dùng admin).
  #   2. Với mỗi dashboard muốn nhúng: mở dashboard -> "..." -> "Embed
  #      dashboard" -> lấy đúng UUID (chính là `superset_dashboard_uid`
  #      lưu ở bảng `reporting.dashboards`).
  #   3. Đặt `SUPERSET_GUEST_TOKEN_USERNAME`/`SUPERSET_GUEST_TOKEN_PASSWORD`
  #      trong `.env` khớp tài khoản dịch vụ ở bước 1.
  superset:
    image: apache/superset:3.1.0
    container_name: hy-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_me_in_production}
      SUPERSET_GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_JWT_SECRET:-change_me_in_production}
      SUPERSET_GUEST_TOKEN_TTL_SECONDS: ${SUPERSET_GUEST_TOKEN_TTL_SECONDS:-300}
      SUPERSET_ALLOWED_EMBEDDED_ORIGINS: ${SUPERSET_ALLOWED_EMBEDDED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/superset
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username ${SUPERSET_ADMIN_USERNAME:-admin} --password ${SUPERSET_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --email admin@example.com || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"

  # ---------- Microservices (Clean Architecture) ----------
  auth-identity-service:
    build: ./services/auth-identity-service
    container_name: hy-auth-identity-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-hungyen-financial}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-auth-identity-service}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-guide-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8001:8000"

  ingestion-service:
    build: ./services/ingestion-service
    container_name: hy-ingestion-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_TABMIS_INTAKE: ${MINIO_BUCKET_TABMIS_INTAKE:-tabmis-intake}
      # UC-024/UC-030: bucket chứa văn bản PDF/bản quét (đọc lại bởi
      # data-quality-service khi xử lý OCR).
      MINIO_BUCKET_RAW_DOCUMENTS: ${MINIO_BUCKET_RAW_DOCUMENTS:-raw-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_password}@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "8002:8000"

  data-quality-service:
    build: ./services/data-quality-service
    container_name: hy-data-quality-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
      # UC-029: đọc dữ liệu thô (đã do ingestion-service ghi vào MinIO khi
      # phát sự kiện parsing.requested) — dùng CHUNG 1 MinIO hạ tầng và
      # CHUNG tên bucket mặc định "tabmis-intake" với ingestion-service.
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_TABMIS_INTAKE: ${MINIO_BUCKET_TABMIS_INTAKE:-tabmis-intake}
      # UC-030: đọc tệp PDF/bản quét (đã do ingestion-service UC-024 ghi vào
      # MinIO khi phát sự kiện ocr.requested) — CHUNG bucket "raw-documents"
      # với ingestion-service.
      MINIO_BUCKET_RAW_DOCUMENTS: ${MINIO_BUCKET_RAW_DOCUMENTS:-raw-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_password}@rabbitmq:5672/%2F
      # UC-030: bật bộ máy OCR THẬT PaddleOCR (trước đây mặc định là
      # NoOpOcrEngine giả lập cho dev/test) — xem app/infrastructure/ocr_engine.py.
      OCR_USE_REAL_ENGINE: ${OCR_USE_REAL_ENGINE:-true}
      OCR_ENGINE: ${OCR_ENGINE:-PADDLEOCR}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "8003:8000"

  reporting-service:
    build: ./services/reporting-service
    container_name: hy-reporting-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
      # UC-047 (nâng cấp) — xem ADR-005 trong ARCHITECTURE.md.
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8088}
      SUPERSET_GUEST_TOKEN_USERNAME: ${SUPERSET_GUEST_TOKEN_USERNAME:-}
      SUPERSET_GUEST_TOKEN_PASSWORD: ${SUPERSET_GUEST_TOKEN_PASSWORD:-}
      SUPERSET_AUTH_PROVIDER: db
    depends_on:
      postgres:
        condition: service_healthy
      superset:
        condition: service_started
    ports:
      - "8004:8000"

  api-gateway-service:
    build: ./services/api-gateway-service
    container_name: hy-api-gateway-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"

  ai-service:
    build: ./services/ai-service
    container_name: hy-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8006:8000"

  ops-service:
    build: ./services/ops-service
    container_name: hy-ops-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8000"

  gov-report-service:
    build: ./services/gov-report-service
    container_name: hy-gov-report-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-financial_dw}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8008:8000"

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    container_name: hy-frontend
    restart: unless-stopped
    depends_on:
      - auth-identity-service
    ports:
      - "5173:80"

volumes:
  pgdata:
  miniodata: